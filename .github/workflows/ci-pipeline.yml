# 1. Trigger name configuration
name: Automated DevOps Infrastructure Check

# 2. Fire the execution flow automatically whenever code is pushed to main
on:
  push:
    branches: [ "main" ]

# 3. Setup the isolated runtime workspace variables
jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    # Step A: Download the current files from the GitHub branch repository
    - name: Checkout Code Blueprint
      uses: actions/checkout@v4

    # Step B: Spin up a clean environment layer block matching your python version
    - name: Setup System Python
      uses: actions/setup-python@v5
      with:
        python-spec: '3.10'

    # Step C: Install your project library tools via pip utility module
    - name: Install System Monitor Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psutil requests paramiko schedule flask

    # Step D: Trigger your diagnostics check tool to execute system reports automatically
    - name: Run Host Health Diagnostics Script
      run: |
        python Python/system_health.py
